org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Incremental Kotlin sering gagal menutup cache di Windows ("Could not close
# incremental caches"). Nonaktifkan agar build stabil.
kotlin.incremental=false
# Sebagian plugin (file_picker) meng-compile Kotlin ke JVM 21 sementara Java-nya 17.
# Turunkan validasi jadi peringatan agar build tidak gagal karena selisih ini.
kotlin.jvm.target.validation.mode=warning
